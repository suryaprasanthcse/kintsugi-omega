[project]
name = "kintsugi-host-triage"
version = "0.1.0"
description = "Triage: a GitHub issue triage agent on a frozen snapshot (KINTSUGI-Ω host, spec §5.9.3)."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Surya Prasanth R", email = "suryaprasanthcse@gmail.com" }]
dependencies = ["kintsugi-hostkit", "pyyaml>=6.0.2"]

[tool.uv.sources]
kintsugi-hostkit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]
