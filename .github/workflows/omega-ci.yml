name: omega-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENTIRE_TEST_TTY: "0"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: make check (ruff, pyright, pytest)
        run: make check
